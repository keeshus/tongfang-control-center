[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avell-unofficial-control-center"
version = "1.1.0"
description = "A driver and interface to control RGB keyboard backlight on ITE 8291 devices (e.g., Avell laptops) on Linux."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Rodrigo Gomes da Cunha", email = "rodgomesc@gmail.com"},
]
keywords = ["rgb", "keyboard", "driver", "linux", "avell", "tongfang"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "pyusb>=1.3.1",
    "elevate>=0.1.3",
]

[project.urls]
"Homepage" = "https://github.com/rodgomesc/avell-unofficial-control-center"
"Bug Tracker" = "https://github.com/rodgomesc/avell-unofficial-control-center/issues"

[project.scripts]
aucc = "aucc.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aucc*"]
namespaces = true

[tool.setuptools.package-data]
aucc = ["**/*"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PTH"]
ignore = []
